name: Android Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      create_github_release:
        description: "Attach release APK and AAB to a GitHub Release"
        required: false
        type: boolean
        default: false

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    # Do not run the debug CI job for version-tag releases.
    if: "!startsWith(github.ref, 'refs/tags/v')"

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Diagnose Compose compiler configuration
        run: |
          echo "=== Gradle version ==="
          ./gradlew --version

          echo "=== Searching for legacy Compose compiler configuration ==="
          if grep -RniE \
            "androidx\.compose\.compiler|kotlinCompilerExtensionVersion|composeOptions|ComposePluginRegistrar|compose-compiler|compiler-hosted" \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            .; then
            echo ""
            echo "WARNING: A legacy Compose compiler reference was found."
          else
            echo "No legacy Compose compiler references found."
          fi

      - name: Clean
        run: ./gradlew clean --stacktrace --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Build Signed Release
    runs-on: ubuntu-latest

    # Release builds:
    # - automatically on vX.Y.Z tags
    # - manually through workflow_dispatch
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Resolve signing keystore
        id: signing
        env:
          HAS_REAL_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"

          if [ "$HAS_REAL_KEYSTORE" = "true" ]; then
            echo "Using the real upload keystore from repository secrets."

            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

            STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            KEY_ALIAS="${RELEASE_KEY_ALIAS:-upload}"
            KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"

            IS_THROWAWAY=false
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret configured."
            echo "Generating a throwaway keystore for this run."

            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_ALIAS="upload"
            KEY_PASSWORD="$STORE_PASSWORD"

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=App Design (CI auto-generated), OU=CI, O=biblia, L=Unknown, S=Unknown, C=US"

            IS_THROWAWAY=true
          fi

          {
            echo "keystore_path=$KEYSTORE_PATH"
            echo "is_throwaway=$IS_THROWAWAY"
          } >> "$GITHUB_OUTPUT"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Clean
        run: ./gradlew clean --stacktrace --no-daemon

      - name: Build signed release APK + AAB
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            --stacktrace \
            --no-daemon

      - name: Clean up keystore file
        if: always()
        run: |
          rm -f "${{ steps.signing.outputs.keystore_path }}"

      - name: Warn about throwaway signing key
        if: steps.signing.outputs.is_throwaway == 'true'
        run: |
          {
            echo "### :warning: Signed with an auto-generated, throwaway keystore"
            echo
            echo "No \`RELEASE_KEYSTORE_BASE64\` secret is configured."
            echo
            echo "This build is correctly signed, but the keystore is generated"
            echo "only for this workflow run and is then discarded."
            echo
            echo "A future build will have a different signing key."
            echo "Therefore this build cannot be used as an update to an app"
            echo "signed with another key."
            echo
            echo "For a permanent signing identity, configure:"
            echo
            echo "- \`RELEASE_KEYSTORE_BASE64\`"
            echo "- \`RELEASE_STORE_PASSWORD\`"
            echo "- \`RELEASE_KEY_ALIAS\`"
            echo "- \`RELEASE_KEY_PASSWORD\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          inputs.create_github_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true