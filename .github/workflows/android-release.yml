name: Android Release

# Builds a signed release APK + AAB.
#
# Signing key: if the repo has RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD /
# RELEASE_KEY_PASSWORD configured as GitHub Secrets, that real upload key is used (needed to
# publish updates to an existing Play Store listing, since upgrades must be signed with the
# same key every time). If those secrets are absent - the default for a fresh clone of this
# framework - a throwaway keystore is generated on the runner with `keytool` so the workflow
# still produces a validly-signed, installable build with zero setup. That throwaway key is
# never persisted anywhere and is different on every run, so it's only good for one-off
# installs/testing, never for shipping real updates - see the job summary this workflow
# prints for a reminder of exactly that.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      create_github_release:
        description: "Attach build outputs to a GitHub Release"
        type: boolean
        default: false

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Resolve signing keystore
        id: signing
        env:
          HAS_REAL_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"

          if [ "$HAS_REAL_KEYSTORE" = "true" ]; then
            echo "Using the real upload keystore from repo secrets."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            KEY_ALIAS="${RELEASE_KEY_ALIAS:-upload}"
            KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"
            IS_THROWAWAY=false
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret configured - autogenerating a throwaway keystore for this run."
            STORE_PASSWORD=$(openssl rand -hex 24)
            KEY_ALIAS="upload"
            KEY_PASSWORD="$STORE_PASSWORD"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=App Design (CI auto-generated), OU=CI, O=biblia, L=Unknown, S=Unknown, C=US"
            IS_THROWAWAY=true
          fi

          {
            echo "keystore_path=$KEYSTORE_PATH"
            echo "is_throwaway=$IS_THROWAWAY"
          } >> "$GITHUB_OUTPUT"

          # Masked so the values never show up in run logs.
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build signed release APK + AAB
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          # STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD come from GITHUB_ENV set above.
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Clean up keystore file
        if: always()
        run: rm -f "${{ steps.signing.outputs.keystore_path }}"

      - name: Warn about throwaway signing key
        if: steps.signing.outputs.is_throwaway == 'true'
        run: |
          {
            echo "### :warning: Signed with an auto-generated, throwaway keystore"
            echo
            echo "No \`RELEASE_KEYSTORE_BASE64\` secret is configured, so this build was signed"
            echo "with a fresh keystore generated just for this run and then discarded. It's a"
            echo "real signature (the APK/AAB install fine), but it will be a **different key"
            echo "every run** - installing this build won't upgrade a previous one, and it"
            echo "can't be uploaded to Play Console as an update to an existing app."
            echo
            echo "To get a stable signing identity: generate a real keystore once (see README"
            echo "> Releasing), then add it as repo secrets \`RELEASE_KEYSTORE_BASE64\`,"
            echo "\`RELEASE_STORE_PASSWORD\`, \`RELEASE_KEY_ALIAS\`, \`RELEASE_KEY_PASSWORD\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_github_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
